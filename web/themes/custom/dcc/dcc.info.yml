name: Disability Care Center
type: theme
description: DCC subtheme
core: 8.x
core_version_requirement: ^8 || ^9 || ^10
libraries:
  - dcc/global-styling
  - dcc/bootstrap_cdn
libraries-override:
  # we_megamenu 1.17+ pulls in Bootstrap 5 CSS, which conflicts with the
  # Bootstrap 4 base theme.
  we_megamenu/form.we-mega-menu-frontend:
    css:
      theme:
        https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css: false
# Defines the base theme
base theme: bootstrap4
regions:
  header: 'Header'
  navigation: 'Navigation'
  content: 'Main content'
  sidebar: 'Sidebar'
  footer_first: 'Footer 1'
  footer_second: 'Footer 2'
